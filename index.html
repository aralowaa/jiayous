<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>good luck! you've got this!</title>
    <style>
        :root {
            --cream: #FDFBF7;
            --pastel-yellow: #FFF8D6;
            --sage-green: #D4E0CE;
            --brown: #8B7355;
            --text-dark: #5C4A3D;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--pastel-yellow);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: var(--brown);
            margin-bottom: 5px;
            font-size: 2.5rem;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: var(--text-dark);
        }

        /* Confetti Container */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            animation: explode 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 1;
        }

        @keyframes explode {
            0% { 
                transform: translate(0, 0) scale(0.5) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); 
                opacity: 0; 
            }
        }

        /* Face Petting Section */
        .face-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .face-container:active {
            transform: scale(0.85);
        }

        .face-image {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 10px solid var(--sage-green);
            box-shadow: 0 15px 30px rgba(139, 115, 85, 0.3);
            background-color: var(--cream);
        }

        /* Notification Toast */
        #toast {
            visibility: hidden;
            min-width: 280px;
            max-width: 80%;
            background-color: var(--brown);
            color: var(--cream);
            text-align: center;
            border-radius: 12px;
            padding: 18px 24px;
            position: fixed;
            z-index: 100;
            bottom: -50px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 60px;
        }
    </style>
</head>
<body>

    <div id="confetti-container"></div>

    <h1>tap for good luck!</h1>
    <p>give me a pet for a boost of energy!</p>
    
    <div class="face-container" onclick="petFace(event)">
        <img src="photo_13_2026-11-11_20-11-10.jpg" alt="my face" class="face-image" onerror="this.src='https://via.placeholder.com/280/D4E0CE/8B7355?text=Put+Face+Here'">
    </div>

    <div id="toast">message goes here</div>

    <script>
        const messages = [
            "you are going to do amazing!",
            "i believe in you so much!",
            "just a little more studying, you can do it!",
            "you are the smartest person i know hehe",
            "i am so incredibly proud of you <3",
            "sending you the biggest huggggggggggg",
            "you have worked so hard for this!",
            "don't forget to take a breather!",
            "you are going to ace this!",
            "i am always cheering you on <3",
            "all your hard work will pay off ~",
            "you have totally got this in the bag!",
            "remember to drink some water!!!!",
            "i can't wait to celebrate with you after muehehe",
            "you are a superstar baby",
            "keeping you in my thoughts today and everyday i miss you",
            "you are stronger than any exam rawr",
            "take it one question at a time!",
            "you make me so proud every single day!",
            "i love seeing you try your best <3",
            "you're doing so well, keep it up hehe",
            "everything is going to be okay hehe"
        ];

        let toastTimeout;

        function petFace(event) {
            createConfetti(event);
            showRandomMessage();
        }

        function createConfetti(event) {
            const container = document.getElementById('confetti-container');
            const face = event.currentTarget;
            const rect = face.getBoundingClientRect();
            
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                const icons = ['💖', '✨', '🍀', '🤎', '⭐'];
                heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                
                const startX = rect.left + (rect.width / 2);
                const startY = rect.top + (rect.height / 2);
                
                heart.style.left = `${startX - 15}px`; 
                heart.style.top = `${startY - 15}px`;
                
                const angle = Math.random() * Math.PI * 2; 
                const velocity = 150 + Math.random() * 250; 
                
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 50; 
                const rot = (Math.random() - 0.5) * 720; 
                
                heart.style.setProperty('--tx', `${tx}px`);
                heart.style.setProperty('--ty', `${ty}px`);
                heart.style.setProperty('--rot', `${rot}deg`);
                
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 1200);
            }
        }

        function showRandomMessage() {
            const toast = document.getElementById("toast");
            
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            toast.innerText = randomMsg;
            
            toast.classList.add("show");
            
            clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(function(){ 
                toast.classList.remove("show"); 
            }, 3000);
        }
    </script>
</body>
</html>
